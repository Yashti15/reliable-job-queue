name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests & Integration
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run backend unit and integration tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/reliable_job_queue_test
          AUTH_JWT_SECRET: ci-test-jwt-secret-with-at-least-thirty-two-bytes-12345
          WORKER_POLL_INTERVAL_MS: 1000

      - name: Test artifact cleanup safety CLI
        run: |
          npm run cleanup:artifacts -- --dry-run
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/reliable_job_queue_test
          ARTIFACT_CLEANUP_TARGET_ID: reliable_job_queue_test

      - name: Run smoke queue benchmark
        run: npm run benchmark
        working-directory: server
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/reliable_job_queue_test
          AUTH_JWT_SECRET: ci-test-jwt-secret-with-at-least-thirty-two-bytes-12345
          BENCH_JOB_VOLUMES: '50'
          BENCH_WORKER_COUNTS: '2'

  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client component tests
        run: npm test
        working-directory: client

      - name: Build client production bundle
        run: npm run build
        working-directory: client

  docker-verification:
    name: Docker Configuration & Image Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare test environment for Compose validation
        run: |
          cat << 'EOF' > .env
          MONGO_ROOT_USERNAME=test_root_user
          MONGO_ROOT_PASSWORD=test_secure_password_base64url_123456789
          AUTH_JWT_SECRET=test_jwt_secret_with_more_than_thirty_two_bytes_length
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker containers
        run: docker compose build --parallel
