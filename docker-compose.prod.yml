services:
  mongo:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in your production environment}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in your production environment}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    command: ["node", "src/server.js"]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/reliable_job_queue?authSource=admin"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in your production environment}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to your HTTPS production domain}
      JOB_STORAGE_DIR: /app/storage
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-52428800}
      USER_MAX_UPLOAD_COUNT: ${USER_MAX_UPLOAD_COUNT:-50}
      USER_MAX_PENDING_JOBS: ${USER_MAX_PENDING_JOBS:-50}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-false}
      EMAIL_ALLOWED_RECIPIENTS: ${EMAIL_ALLOWED_RECIPIENTS:-}
    volumes:
      - artifact_prod_storage:/app/storage
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/reliable_job_queue?authSource=admin"
      JOB_STORAGE_DIR: /app/storage
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-30000}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-false}
      EMAIL_ALLOWED_RECIPIENTS: ${EMAIL_ALLOWED_RECIPIENTS:-}
    volumes:
      - artifact_prod_storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo_prod_data:
  artifact_prod_storage:
