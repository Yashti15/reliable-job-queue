services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the project .env file}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/server.js"]
    environment:
      PORT: 5000
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the project .env file}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the project .env file}@mongo:27017/reliable_job_queue?authSource=admin"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the project .env file}
      CLIENT_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:80
      JOB_STORAGE_DIR: /app/storage
      EMAIL_DEMO_MODE: "true"
      WORKER_POLL_INTERVAL_MS: 2000
    volumes:
      - artifact_storage:/app/storage
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the project .env file}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the project .env file}@mongo:27017/reliable_job_queue?authSource=admin"
      JOB_STORAGE_DIR: /app/storage
      EMAIL_DEMO_MODE: "true"
      WORKER_POLL_INTERVAL_MS: 2000
    volumes:
      - artifact_storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
  artifact_storage:
